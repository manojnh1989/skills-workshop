  <title>Skills Explained</title>

      color: #24292f;

      font-size: 3rem;

    }

      font-size: 1.2rem;

      max-width: 800px;
      margin: auto;
    }

    .container {
      max-width: 1100px;

    .card {

      padding: 30px;

    p {

    }

    li {
      margin-bottom: 8px;
    }

    code {
      background: #f0f2f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: Consolas, monospace;
    }

    pre {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 20px 0;
    }

      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    table th,
    table td {
      border: 1px solid #d0d7de;
      padding: 14px;
      text-align: left;
    }
